[package]
name = "sudoku"
version = "1.0.0"
description = "A Sudoku game built with Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "sudoku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
